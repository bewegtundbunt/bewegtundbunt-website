<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#173404" />
  <title>Kontakt – bewegt & bunt</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <style>
    :root { --primary:#1A4D3E; --accent:#C8955A; --bg:#F8F6F1; --text:#2A2F2A; --muted:#6B7B6B; --border:rgba(26,77,62,0.10); }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;}
    header{background:rgba(248,246,241,0.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .brand{font-family:'Dancing Script',cursive;font-size:26px;font-weight:700;color:var(--primary);text-decoration:none;}
    .back{font-size:13px;color:var(--muted);text-decoration:none;font-weight:600;}
    .back:hover{color:var(--primary);}
    .wrap{max-width:580px;margin:0 auto;padding:100px 28px;}
    h1{font-size:clamp(28px,4vw,38px);color:var(--primary);font-weight:700;margin-bottom:16px;}
    p{font-size:16px;color:var(--text);line-height:1.7;margin-bottom:24px;}
    .email-link{font-size:20px;color:var(--primary);text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:2px;font-weight:500;}
    .email-link:hover{border-color:var(--primary);}
    footer{border-top:1px solid var(--border);padding:28px;text-align:center;font-size:13px;color:var(--muted);background:#fff;position:fixed;bottom:0;left:0;right:0;}
    footer a{color:var(--primary);text-decoration:none;margin:0 8px;}
  </style>
</head>
<body>

<script>
  if (window.location.hostname.includes('staging')) {
    var banner = document.createElement('div');
    banner.innerHTML = '🛠️ TESTUMGEBUNG – keine Live-Seite';
    banner.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:#ff6b00;color:white;text-align:center;padding:8px;font-weight:bold;font-size:14px;z-index:99999;';
    document.body.appendChild(banner);
  }
</script>

<header>
  <a class="brand" href="/">„bewegt & bunt"</a>
  <a class="back" href="/">← Zurück zur Website</a>
</header>

<div class="wrap">
  <h1>Kontakt</h1>
  <p>Schreib mir gerne eine E-Mail — ich antworte zeitnah.</p>
  <a href="mailto:info@bewegtundbunt.de" class="email-link">info@bewegtundbunt.de</a>
</div>

<footer>
  <a href="/">Startseite</a>
  <a href="/Impressum.html">Impressum</a>
  <a href="/datenschutz.html">Datenschutz</a>
</footer>

</body>
</html>
