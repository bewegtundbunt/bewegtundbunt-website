# Ziel im App-Repo: .github/workflows/supabase-wachhalten.yml
# Hält das Supabase-Projekt der Anmeldung (kostenloser Plan) wach.
# Keine Geheimnisse, keine Repo-Einstellungen: Adresse (SB_URL) und öffentlicher
# anon-Schlüssel (SB_KEY) werden beim Lauf aus index.html gelesen, der Tabellenname
# aus admin_setup.sql. Nur eine lesende Abfrage (limit=1), keine Datenbankänderung.
# Hinweis: Zeitpläne laufen erst, wenn die Datei auf dem Standardzweig (main) liegt.
name: Supabase wachhalten

on:
  schedule:
    - cron: '17 4 * * 1,4'   # Montag und Donnerstag, 04:17 UTC (früh morgens)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-wachhalten
  cancel-in-progress: false

jobs:
  anstupsen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Adresse, Schlüssel und Tabelle auslesen
        id: werte
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys

          dateien = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.split("\n")

          def finde(name):
              treffer = sorted((f for f in dateien if f == name or f.endswith("/" + name)), key=lambda f: f.count("/"))
              if not treffer:
                  sys.exit(f"::error::{name} nicht im Repo gefunden")
              return treffer[0]

          html = open(finde("index.html"), encoding="utf-8").read()

          def wert(name):
              m = re.search(name + r"""\s*[:=]\s*(['"`])([^'"`]+)\1""", html)
              if not m:
                  sys.exit(f"::error::{name} nicht in index.html gefunden")
              return m.group(2).strip()

          sb_url = wert("SB_URL").rstrip("/")
          sb_key = wert("SB_KEY")
          if not sb_url.startswith("https://"):
              sys.exit("::error::SB_URL ist keine https-Adresse")

          sql = open(finde("admin_setup.sql"), encoding="utf-8").read()
          sql = re.sub(r"--[^\n]*", "", sql)
          tabelle = None
          for m in re.finditer(r'create\s+table\s+(?:if\s+not\s+exists\s+)?((?:"?\w+"?\.)?"?\w+"?)', sql, re.I):
              teile = m.group(1).replace('"', "").split(".")
              if len(teile) == 1 or teile[0].lower() == "public":
                  tabelle = teile[-1]
                  break
          if not tabelle:
              sys.exit("::error::keine Tabelle im Schema public in admin_setup.sql gefunden")

          print(f"::add-mask::{sb_key}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as aus:
              aus.write(f"url={sb_url}\nkey={sb_key}\ntabelle={tabelle}\n")
          print(f"Adresse: {sb_url} – Tabelle: {tabelle}")
          PY

      - name: Lesende Abfrage (drei Versuche)
        shell: bash
        env:
          SB_URL: ${{ steps.werte.outputs.url }}
          SB_KEY: ${{ steps.werte.outputs.key }}
          TABELLE: ${{ steps.werte.outputs.tabelle }}
        run: |
          set -uo pipefail
          echo "::add-mask::${SB_KEY}"
          kopf=(-H "apikey: ${SB_KEY}" -H "Accept: application/json")
          # Alte anon-Schlüssel sind JWTs und brauchen zusätzlich den Bearer-Kopf.
          if [[ "${SB_KEY}" == eyJ* ]]; then kopf+=(-H "Authorization: Bearer ${SB_KEY}"); fi
          ziel="${SB_URL}/rest/v1/${TABELLE}?select=*&limit=1"
          for versuch in 1 2 3; do
            code=$(curl -sS -o /tmp/antwort.json -w '%{http_code}' --max-time 20 "${kopf[@]}" "$ziel") || true
            code=${code:-000}
            if [[ "$code" == 200 || "$code" == 206 ]]; then
              echo "Versuch ${versuch}: HTTP ${code} – Supabase ist wach (Tabelle ${TABELLE})."
              exit 0
            fi
            echo "::warning::Versuch ${versuch}: HTTP ${code}"
            head -c 300 /tmp/antwort.json 2>/dev/null; echo
            [[ $versuch -lt 3 ]] && sleep 20
          done
          echo "::error::Supabase hat nach drei Versuchen nicht geantwortet."
          exit 1
